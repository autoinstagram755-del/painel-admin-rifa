<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Background Shape -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#gold)" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- Watch Ring / Medal of Solidarity -->
  <circle cx="32" cy="32" r="18" stroke="url(#gold)" stroke-width="3" fill="#090d16" />
  <circle cx="32" cy="32" r="14.5" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
  
  <!-- Crown / Watch Button at top -->
  <rect x="29" y="8" width="6" height="4" rx="1.5" fill="url(#gold)" />
  
  <!-- Watch Hands (pointing to victory / mission) -->
  <line x1="32" y1="32" x2="32" y2="21" stroke="url(#goldLight)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="40" y2="27" stroke="url(#goldLight)" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Central Jewel Dot -->
  <circle cx="32" cy="32" r="2.5" fill="#fef08a" />

  <!-- Gleaming Sparkle Top Right -->
  <path d="M46 14L47.5 18.5L52 20L47.5 21.5L46 26L44.5 21.5L40 20L44.5 18.5Z" fill="url(#gold)" />
</svg>
